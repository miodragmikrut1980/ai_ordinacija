[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-ai-assistant"
dynamic = ["version"]
description = "Professional AI assistant MVP for private clinics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5.0,<6",
  "python-docx>=1.1,<2",
  "httpx>=0.27,<1",
  "reportlab>=4.2,<5",
  "cryptography>=42,<44"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<6"]

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
