name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=backend pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinic-ai-assistant:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name clinic-ci -p 8080:8080 -e CLINIC_ENV=demo -e CLINIC_LOG_FORMAT=json clinic-ai-assistant:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "Container did not become healthy in time" >&2
          docker logs clinic-ci
          exit 1
