name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=backend pytest -q

  hash-locked-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install strictly from requirements.lock with hash verification
        # This is the actual guarantee requirements.lock exists to provide:
        # every dependency (including transitive ones) is pinned to an
        # exact version AND exact sha256 hash, so this step fails closed
        # if PyPI ever serves something different from what was reviewed
        # at release time. pyproject.toml's version RANGES are what
        # contributors work against day to day; this job is what a real
        # release build should actually run.
        run: pip install --require-hashes -r requirements.lock
      - name: Import the app to confirm the locked set is actually sufficient
        run: PYTHONPATH=backend python -c "from app.main import app; print('locked install imports cleanly')"
        env:
          CLINIC_ENV: demo

  dependency-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan locked dependencies for known vulnerabilities
        # Scans the exact hash-locked dependency set (not just pyproject's
        # version ranges) against the PyPA advisory database. Fails the
        # build on any known CVE in a pinned package -- this is the
        # "automatski dependency/security scan" the project didn't have
        # before. A finding here means requirements.lock needs
        # regenerating (see its header comment) to pick up a patched
        # version, not that the check should be silenced.
        run: pip-audit -r requirements.lock --strict

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinic-ai-assistant:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name clinic-ci -p 8080:8080 -e CLINIC_ENV=demo -e CLINIC_LOG_FORMAT=json clinic-ai-assistant:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "Container did not become healthy in time" >&2
          docker logs clinic-ci
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python app
        run: python -m pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install E2E dependencies
        run: npm install

      - name: Install Playwright browsers
        # --with-deps also installs the OS-level libraries Chromium needs
        # on a bare Ubuntu runner (fonts, codecs, etc.) -- this is the step
        # that could never run in the sandbox that wrote these tests (see
        # e2e/README.md): it downloads from cdn.playwright.dev, which
        # that environment has no egress access to.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
